# Descarga el JSON de la API de carburantes y lo carga en Snowflake (RAW) cada 3 horas.
name: Ingesta precios carburantes

on:
  workflow_dispatch:
  schedule:
    # GitHub interpreta el cron en UTC y puede arrancar con varios minutos de retraso.
    - cron: "0 */3 * * *"

permissions:
  contents: read

jobs:
  ingesta:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
      SNOWFLAKE_ROLE: SYSADMIN
      SNOWFLAKE_WAREHOUSE: CARBURANTES_WH
      SNOWFLAKE_DATABASE: CARBURANTES_DB
      SNOWFLAKE_SCHEMA: RAW
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Preparar la clave de Snowflake
        env:
          SNOWFLAKE_PRIVATE_KEY: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}
        run: |
          key_path="$RUNNER_TEMP/snowflake_key.p8"
          printf '%s\n' "$SNOWFLAKE_PRIVATE_KEY" > "$key_path"
          chmod 600 "$key_path"
          echo "SNOWFLAKE_PRIVATE_KEY_PATH=$key_path" >> "$GITHUB_ENV"

      - name: Ejecutar la ingesta
        shell: bash
        run: python ingestion/ingest_fuel_prices.py | tee -a "$GITHUB_STEP_SUMMARY"
